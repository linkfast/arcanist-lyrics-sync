name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # The extension builds against Arcanist, checked out beside it as ../../Arcanist.
      - uses: actions/checkout@v4
        with:
          path: ArcanistExtensions/lyrics-sync
      - uses: actions/checkout@v4
        with:
          repository: linkfast/arcanist
          ref: ${{ vars.ARCANIST_REF || 'main' }}
          path: Arcanist
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: ArcanistExtensions/lyrics-sync/global.json
      - name: Test
        working-directory: ArcanistExtensions/lyrics-sync
        run: dotnet test --project tests/Arcanist.LyricsSync.Tests --artifacts-path artifacts/build
      - name: Package
        working-directory: ArcanistExtensions/lyrics-sync
        run: sh pack.sh
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: ArcanistExtensions/lyrics-sync/artifacts/arcanist-lyrics-sync-*.zip*
